<text xml:space="preserve" text-anchor="middle" x="273" y="-67.8" font-family="Helvetica,sans-Serif" font-size="11.00">• Copia bytes crudos: sirve para el texto cifrado, que puede tener bytes 0.</text>
<text xml:space="preserve" text-anchor="middle" x="273" y="-55.8" font-family="Helvetica,sans-Serif" font-size="11.00">• No revisa tamaños: dest debe tener espacio para n bytes.</text>
<text xml:space="preserve" text-anchor="middle" x="273" y="-43.8" font-family="Helvetica,sans-Serif" font-size="11.00">• Si dest y src se traslapan el resultado no está definido (para eso existe memmove).</text>
<text xml:space="preserve" text-anchor="middle" x="273" y="-31.8" font-family="Helvetica,sans-Serif" font-size="11.00">• Las implementaciones reales copian de 8 o 16 bytes a la vez (palabras o SIMD),</text>
<text xml:space="preserve" text-anchor="middle" x="273" y="-19.8" font-family="Helvetica,sans-Serif" font-size="11.00"> &#160;&#160;pero el resultado es el mismo que este ciclo.</text>
<text xml:space="preserve" text-anchor="middle" x="273" y="-7.8" font-family="Helvetica,sans-Serif" font-size="11.00">• En bruteforce.c se usa en main (eltexto → cipher) y en tryKey (ciph → temp).</text>
</g>
